<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Raksha Signal - Emergency SOS</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🚨 Raksha Signal</h1>
    <p>Smart Emergency Alert &amp; Safety System</p>
  </header>

  <main>
    <section id="controls">
      <button id="sosBtn">SOS</button>
      <button id="endBtn" disabled>End Emergency</button>
      <p id="status">Status: Idle</p>
    </section>

    <section id="map-section">
      <div id="map"></div>
    </section>

    <section id="nearby">
      <div class="nearby-col">
        <h2>Nearby Hospitals</h2>
        <ul id="hospitalList"></ul>
      </div>
      <div class="nearby-col">
        <h2>Nearby Police Stations</h2>
        <ul id="policeList"></ul>
      </div>
    </section>
  </main>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="script.js"></script>
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&callback=initMap" async defer></script>
</body>
</html>
